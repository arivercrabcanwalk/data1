name: V3 Actual Data Cache
on:
  push:
    branches: [research/system-v3-20260906]
    paths: ['.github/workflows/v3-cache.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        month: ['2026-03', '2026-04', '2026-05', '2026-06', '2026-07', '2026-08']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            ${{ matrix.month }}
            research_v3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -q numpy==2.2.6 pandas==2.2.3 pyarrow==19.0.1
      - name: Export actual input data
        run: python research_v3/export_cache.py ${{ matrix.month }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-cache-${{ matrix.month }}
          path: cache/${{ matrix.month }}/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
