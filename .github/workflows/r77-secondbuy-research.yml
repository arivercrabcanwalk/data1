name: R77 second-buy isolated historical research
on:
  push:
    branches: ["research/r77-secondbuy-20261016"]
    paths: ["research/r77/**", ".github/workflows/r77-secondbuy-research.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow
      - name: Causal full-market identity catalogue
        run: python research/r77/daily_catalogue.py
      - name: T+1 three-route second-buy exploratory research
        run: python research/r77/second_buy_engine.py
      - name: Mandatory result and censoring audit
        run: |
          python - <<'PY'
          import json,pathlib,pandas as pd
          out=pathlib.Path('r77_out')
          c=json.loads((out/'R77_daily_qa.json').read_text())
          e=json.loads((out/'R77_exec_qa.json').read_text())
          assert c['status']=='R77_FULLMARKET_DAILY_PASS'
          assert e['status']=='R77_NEW_SECOND_BUY_EXPLORATORY_COMPLETED'
          assert not e['full_account_A_B_overlay_executed']
          assert e['historically_viewed_months_not_blind']
          assert e['executed']==e['closed']+e['right_censored']
          print('R77_ACCEPTED_QA',c,'\\n',e)
          PY
      - name: Preserve full research artefact, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r77-research-not-for-production
          path: r77_out/
          retention-days: 30
          if-no-files-found: warn
