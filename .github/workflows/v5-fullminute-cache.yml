name: V5 Status Audit Run
on:
  push:
    branches: [research/system-v5-fullminute-20260907]
    paths: ['.github/workflows/v5-fullminute-cache.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -q pandas==2.2.3 pyarrow==19.0.1
      - name: Export status audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          cols=['code','date','name','market_board','security_status','is_st','is_new_listing_initial','is_suspended','suspension_status','suspension_event_type','suspend_timing','has_minute_data','minute_row_count','price_limit_up_pct','price_limit_down_pct','status_source','status_confidence','status_notes']
          target=[]; susp=[]
          for p in sorted(Path('.').glob('2026-*/part-*/date=*/daily_stock_status.parquet')):
              d=pd.read_parquet(p)
              use=[c for c in cols if c in d.columns]
              d=d[use].copy(); d['code']=d['code'].astype(str).str.zfill(6)
              h=d[d['code'].eq('001331')]
              if len(h): target.append(h)
              if 'is_suspended' in d.columns:
                  s=d[d['is_suspended'].eq(True)]
                  if len(s): susp.append(s)
          pd.concat(target,ignore_index=True).to_csv('001331_status.csv',index=False)
          (pd.concat(susp,ignore_index=True) if susp else pd.DataFrame(columns=cols)).to_csv('all_suspended_status.csv',index=False)
          print(pd.concat(target,ignore_index=True).to_string(index=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v5-status-audit-run
          path: |
            001331_status.csv
            all_suspended_status.csv
          compression-level: 0
