name: first-buy-v13-meta-walkforward

on:
  push:
    branches:
      - research/first-buy-v13-two-stage-20260928
    paths:
      - 'backtest/first_buy_v13_walkforward.py'
      - 'backtest/first_buy_v13_meta_walkforward.py'
      - 'backtest/first_buy_v13_meta_fast.py'
      - 'backtest/v13_meta/**'
      - '.github/workflows/first-buy-v13-meta.yml'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow scikit-learn
      - name: Syntax checks
        run: |
          python -m py_compile backtest/first_buy_v13_walkforward.py
          python -m py_compile backtest/first_buy_v13_meta_walkforward.py
          python -m py_compile backtest/first_buy_v13_meta_fast.py
      - name: Run cached metadata-aware V13
        run: cd backtest && python first_buy_v13_meta_fast.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: first-buy-v13-meta-fast-results
          path: backtest/results_first_buy_v13_meta_fast/
