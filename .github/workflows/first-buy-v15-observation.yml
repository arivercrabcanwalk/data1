name: first-buy-v15-observation-pool

on:
  push:
    branches:
      - research/first-buy-v15-observation-pool-20260928
    paths:
      - 'backtest/first_buy_v15_observation.py'
      - 'backtest/first_buy_v15_robust_cv.py'
      - '.github/workflows/first-buy-v15-observation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backtest/first_buy_v15_observation.py'
      - 'backtest/first_buy_v15_robust_cv.py'
      - '.github/workflows/first-buy-v15-observation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow scikit-learn
      - name: Syntax checks
        run: |
          python -m py_compile backtest/first_buy_v15_observation.py
          python -m py_compile backtest/first_buy_v15_robust_cv.py
      - name: Run V15 observation-pool research
        run: cd backtest && python first_buy_v15_observation.py
      - name: Run V15 robust multi-month CV
        run: cd backtest && python first_buy_v15_robust_cv.py
      - name: Upload V15 results
        uses: actions/upload-artifact@v4
        with:
          name: first-buy-v15-results
          path: |
            backtest/results_first_buy_v15/
            backtest/results_first_buy_v15_cv/
      - name: Persist V15 audit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/results_first_buy_v15/ backtest/results_first_buy_v15_cv/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Persist V15 observation-pool results [skip ci]"
            git push
          fi
