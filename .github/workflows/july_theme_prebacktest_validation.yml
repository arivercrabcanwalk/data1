name: July Theme Prebacktest Validation

on:
  push:
    branches:
      - july-theme-context-v1
    paths:
      - 'july_theme_system/**'
      - '.github/workflows/july_theme_prebacktest_validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: pip install pandas numpy pyarrow
      - name: Validate complete point-in-time review system and engine contract
        shell: bash
        run: |
          set -euo pipefail
          {
            python july_theme_system/validate_prebacktest.py
            python july_theme_system/validate_phase_map.py
            PYTHONPATH=july_theme_system python july_theme_system/validate_engine_contract.py
          } | tee july_theme_system/PREBACKTEST_VALIDATION.txt
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: july-theme-prebacktest-validation
          path: july_theme_system/PREBACKTEST_VALIDATION.txt
          if-no-files-found: warn
