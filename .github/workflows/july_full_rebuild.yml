name: July Full Rebuild

on:
  push:
    branches: [july-full-rebuild]
    paths:
      - 'july_full_rebuild/**'
      - '.github/workflows/july_full_rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            2026-07
            july_full_rebuild
            .github/workflows/july_full_rebuild.yml
          sparse-checkout-cone-mode: false
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow requests beautifulsoup4 lxml
      - name: Rebuild 23-day full-member PIT web facts
        run: python july_full_rebuild/rebuild_pit_v4.py
      - name: Enforce strict readiness gate
        run: python july_full_rebuild/readiness_gate_v2.py
      - name: Run adaptive causal daily-review backtest
        run: python july_full_rebuild/causal_backtest_v2.py
      - name: Run frozen-review control
        run: python july_full_rebuild/causal_backtest_fixed_control.py
      - name: Upload PIT and both results
        uses: actions/upload-artifact@v4
        with:
          name: july-full-rebuild-results-v5
          path: |
            july_full_rebuild/pit_data/
            july_full_rebuild/results/
            july_full_rebuild/results_fixed_control/
          if-no-files-found: error
