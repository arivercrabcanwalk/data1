name: Research V2
on:
  push:
    branches: [research/backtest-v2-20260906]
    paths: ['.github/workflows/research-v2.yml', 'research_v2/run.py']
permissions:
  contents: read
concurrency:
  group: research-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -q -r research_v2/requirements.txt
      - name: Regression tests
        run: |
          mkdir -p research_v2_results
          python -m pytest research_v2 -q | tee research_v2_results/tests.txt
      - name: Full raw audit and fixed-rule replay
        run: python research_v2/run.py --root . --out research_v2_results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: research-v2-results
          path: research_v2_results/
          if-no-files-found: ignore
          retention-days: 30
