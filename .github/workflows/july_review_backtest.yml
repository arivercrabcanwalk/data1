name: July Review Causal Backtest

on:
  push:
    branches: [july-review-exec2]
    paths:
      - 'july_review/**'
      - '.github/workflows/july_review_backtest.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow
      - name: Patch signed down-limit handling only
        run: sed -i "s/p=pct(rr.get('price_limit_down_pct',np.nan)); pc=rr.prev_close/p=abs(pct(rr.get('price_limit_down_pct',np.nan))); pc=rr.prev_close/" july_review/run_july_review.py
      - name: Run isolated July review backtest
        run: python july_review/run_july_review.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: july-review-causal-results-fixed
          path: july_review_results/
          if-no-files-found: error
