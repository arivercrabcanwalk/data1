name: July Point-in-Time Knowledge Layer

on:
  push:
    branches: [july-knowledge-layer]
    paths:
      - 'july_knowledge/**'
      - '.github/workflows/july_knowledge_layer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow requests beautifulsoup4 pytest
      - name: Build full July PIT knowledge layer v2
        run: python july_knowledge/build_knowledge_layer_v2.py
      - name: Run full admission and anti-leakage tests
        run: pytest -q july_knowledge/test_knowledge_layer_v2.py
      - name: Upload full knowledge artifact
        uses: actions/upload-artifact@v4
        with:
          name: july-knowledge-layer-v2
          path: |
            july_knowledge/generated_v2/
            july_knowledge/raw_web_v2/
          if-no-files-found: error
